<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <img src="images/kalla.png" alt="Kalla Logo" class="logo">
        <h1 class="title"></h1>
        <div class="buttons">
            <button class="home-button" onclick="window.open('https://kalla.co.id/home', '_blank')">Home</button>
            <button class="map-button" id="refresh-button" onclick="refreshMap()">Map</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Map Section -->
        <div class="map-container active" id="map-section">
            <iframe src="map.html" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>

    <script>
        function refreshMap() {
            // Refresh the iframe containing map.html
            const mapIframe = document.querySelector('#map-section iframe');
            mapIframe.src = mapIframe.src; // Reload the iframe
        }
    </script>

</body>
</html>
